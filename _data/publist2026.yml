  title1: "<a href=\"https://www.nature.com/articles/s41551-025-01578-3\" target=\"_blank\"><strong>A visually grounded language model for fetal ultrasound understanding</strong></a>"
  image: Sonomate.png
  description: Ultrasound imaging is one of the most widely used diagnostic tools in prenatal care, but also one of the most operator dependent. Trainee sonographers often face steep learning curves, lack of confidence, and limited access to supervision in busy clinical settings. Sonomate aims to change this. It is a visually grounded language model that ‘listens’ to the sonographer's instructions, interprets real-time ultrasound video, and offers real-time assistance for instance, identifying fetal anatomies and standard planes, checking image quality, reminding clinicians of missed anatomical views or assessing sonographer’s skill. 
  authors: "**Xiaoqing Guo†**, Mohammad Alsharid, He Zhao, Yipei Wang, Jayne Lander, Aris T. Papageorghiou, Alison Noble."
